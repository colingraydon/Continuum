name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-integration:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: E2E (process-based)
        run: go test -v -tags e2e -timeout 120s ./tests/e2e/...

  fault-injection:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: Fault injection (process-based)
        run: go test -v -tags fault -timeout 900s ./tests/fault/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...

  # Same-runner A/B benchmark comparison: runs the CPU-bound benchmark subset
  # on the PR's base commit and head in one job, then fails on statistically
  # significant time regressions above the threshold. Same-runner comparison
  # cancels most shared-VM variance; benchstat's significance test (rows
  # without it show "~" and never fail the gate) filters the rest.
  bench-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Benchmark base
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          go mod download
          make bench-ci > /tmp/bench-base.txt || go test ./benchmarks/ -run 'XXX' -bench . -skip 'Durable|Cluster|StoreScan100|TombstoneGC|ManagerRebuild' -count=8 -benchtime=0.3s > /tmp/bench-base.txt
          git checkout ${{ github.sha }}
      - name: Benchmark head
        run: |
          go mod download
          make bench-ci > /tmp/bench-head.txt
      - name: Compare (fail on >20% significant regressions)
        run: bash scripts/benchguard.sh /tmp/bench-base.txt /tmp/bench-head.txt

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e-integration, fault-injection, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t continuum .

  # Hard coverage floor, enforced in CI so it can gate merges deterministically
  # (Codecov's project status is advisory only). cmd/ is excluded to match the
  # ignore list in codecov.yml: main()'s process wiring is not unit-testable, so
  # the floor tracks the library packages the way the Codecov project target does.
  # Kept last so inserting it never shifts other jobs' lines into a PR's new-code
  # window (which would re-flag their pre-existing findings).
  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: Enforce coverage floor (>= 90%, excluding cmd/)
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          grep -v '/cmd/' coverage.out > coverage.filtered.out
          total=$(go tool cover -func=coverage.filtered.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage excluding cmd/: ${total}%"
          awk -v t="$total" 'BEGIN {
            if (t + 0 < 90.0) {
              printf "::error::coverage %.1f%% is below the 90%% floor\n", t
              exit 1
            }
          }'
