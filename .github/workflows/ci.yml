name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-integration:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Download dependencies
        run: go mod download
      - name: E2E (process-based)
        run: go test -v -tags e2e -timeout 120s ./tests/e2e/...

  fault-injection:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Download dependencies
        run: go mod download
      - name: Fault injection (process-based)
        run: go test -v -tags fault -timeout 900s ./tests/fault/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: golangci-lint
        run: |
          go -C tools install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          golangci-lint run ./...

  # Same-runner A/B benchmark comparison: measures the CPU-bound benchmark
  # subset at the PR's base commit and at its head, then fails on statistically
  # significant time regressions above the threshold. Same-runner comparison
  # cancels most shared-VM variance; benchstat's significance test (rows
  # without it show "~" and never fail the gate) filters the rest.
  #
  # The two sides are measured in alternating rounds rather than one after the
  # other - see scripts/bench-ab.sh for why running them in sequence turns any
  # drift during the job into a one-sided false regression.
  bench-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Install benchstat
        run: go -C tools install golang.org/x/perf/cmd/benchstat
      - name: Benchmark base and head, interleaved
        run: |
          bash scripts/bench-ab.sh \
            ${{ github.event.pull_request.base.sha }} ${{ github.sha }} \
            /tmp/bench-base.txt /tmp/bench-head.txt
      - name: Compare (fail on >20% significant regressions)
        run: bash scripts/benchguard.sh /tmp/bench-base.txt /tmp/bench-head.txt

  # Seeded in-process cluster simulation. Cheap next to the fault suite (one
  # process, no sockets or disks) and it covers ground the other jobs do not:
  # the whole cluster shares an address space, so a seeded schedule of
  # partitions, drops, and crash/restart drives the gossip-membership and ring
  # interaction end to end. Its own runner matters — sim and fault starve each
  # other badly enough to fail on a shared machine, which is why they are
  # separate jobs rather than steps.
  simulation:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Download dependencies
        run: go mod download
      - name: Seeded cluster simulation
        run: go test -v -tags sim -timeout 600s ./tests/sim/...

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e-integration, fault-injection, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t continuum .

  # Workflow files are configuration GitHub parses on its own, so a syntax error
  # in one does not fail a run - it makes the workflow unreadable, and no job
  # starts at all. Nothing goes red, so the failure is invisible on a green PR.
  # A stray ":all:" in docs.yml disabled the docs deploy for seven weeks and
  # broke Dependabot's github-actions updater with it before anyone noticed.
  # Shell/Python linting of run blocks is deliberately off, so this gate behaves
  # identically here and under `make workflow-lint` on a contributor's machine.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: actionlint
        run: |
          go -C tools install github.com/rhysd/actionlint/cmd/actionlint
          actionlint -shellcheck= -pyflakes=

  # Model-checks the TLA+ specification. The other jobs run the system and
  # observe what happens; this one runs no Continuum code at all - it
  # enumerates every interleaving of the modelled protocol within bounded
  # constants and checks the invariants hold in all of them. It guards the
  # design, not the implementation, which is why it complements rather than
  # replaces the fault and simulation suites.
  #
  # Both configurations are exhaustive in about 75s at these bounds. Raising
  # MaxOps by one costs roughly 30x the state space and does not terminate, so
  # the bounds in specs/*.cfg are chosen for what CI can actually finish -
  # see docs/tla-spec.md for why depth was traded for fidelity.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Model-check the specification
        run: make spec
      # Records a real cluster's execution and replays it against the model, so
      # the spec cannot drift away from the implementation unnoticed.
      - name: Check trace conformance
        run: make spec-trace

  # Diff coverage, gated in CI so it can block a merge deterministically.
  # Codecov reports the same measure but cannot gate it: codecov.yml marks the
  # patch status informational, so `codecov/patch` always reports success
  # whatever the number is. Requiring that context blocks a merge only when
  # Codecov fails to answer at all - an availability dependency with no signal.
  # Codecov keeps its report, its PR comment, and the README badge; only the
  # gating moves here.
  #
  # The floor is deliberately below the project floor: the storage engine has
  # filesystem-error branches (fsync/rename/close) that cannot be exercised
  # without an injection seam, which is the same reason codecov.yml made patch
  # informational in the first place. This catches a diff that is largely
  # untested without failing one that touches those paths.
  patch-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit must be present to diff against
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Download dependencies
        run: go mod download
      # Delegates to the make target so CI and a local run measure identically,
      # including the merge-base diff semantics it owns.
      - name: Enforce patch coverage
        run: make patch-coverage BASE="${{ github.event.pull_request.base.sha }}"

  # Post-merge only. The required "SonarCloud Code Analysis" check validates a
  # PR's diff; after the merge Sonar runs a second analysis against the branch,
  # scoped to the project's new-code window, which can fail where the PR passed.
  # That one gates nothing by construction - it only exists once the merge has
  # happened - so main can sit red with every check on the merge commit green.
  # It did, for three hours after #90, because nothing was watching. This job is
  # the watcher; see scripts/sonar-branch-gate.sh for why it binds the verdict
  # to a specific commit rather than asking whether the branch is red now.
  sonar-branch-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the branch quality gate
        run: bash scripts/sonar-branch-gate.sh "${{ github.sha }}"

  # Hard coverage floor, enforced in CI so it can gate merges deterministically
  # (Codecov's project status is advisory only). cmd/ is excluded to match the
  # ignore list in codecov.yml: main()'s process wiring is not unit-testable, so
  # the floor tracks the library packages the way the Codecov project target does.
  # Kept last so inserting it never shifts other jobs' lines into a PR's new-code
  # window (which would re-flag their pre-existing findings).
  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Download dependencies
        run: go mod download
      - name: Enforce coverage floor (>= 90%, excluding cmd/)
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          grep -v '/cmd/' coverage.out > coverage.filtered.out
          total=$(go tool cover -func=coverage.filtered.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage excluding cmd/: ${total}%"
          awk -v t="$total" 'BEGIN {
            if (t + 0 < 90.0) {
              printf "::error::coverage %.1f%% is below the 90%% floor\n", t
              exit 1
            }
          }'
