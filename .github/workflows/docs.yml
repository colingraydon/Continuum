name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - overrides/**
      - requirements-docs.in
      - requirements-docs.txt
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - overrides/**
      - requirements-docs.in
      - requirements-docs.txt
      - .github/workflows/docs.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      # Block scalar, not a plain one: ":all:" ends in a colon, and a colon
      # followed by a space makes a plain scalar unparseable YAML. That does not
      # fail the run - it stops the workflow from being readable at all, so no
      # job starts and Dependabot's github-actions updater errors out too.
      - name: Install docs dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publish only from main, never from a PR, so merging is the go-live action.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
