\* The honest configuration: the quorum clamp is ON, matching what the code
\* actually does (fault-harness finding #4). NoResurrection must hold here.
\*
\* Durability is deliberately NOT checked in this configuration - the clamp
\* makes it violable by design. Strict.cfg checks it with the clamp off.
\*
\* Three nodes with W=2 is the smallest topology that can express a quorum,
\* a minority, and a single tolerable permanent loss.

\* MaxOps is 2 rather than 3 because fan-out is modelled per replica: each
\* leg of a write is its own step, which multiplies the reachable states by
\* roughly 30x. At MaxOps = 3 this configuration exceeds 24M distinct states
\* without terminating; at 2 it is exhaustive in well under a minute.
\*
\* Two operations is enough to reach everything both properties are about: a
\* write followed by a delete produces the resurrection scenario, and a delete
\* followed by a write produces the gate-wipe durability scenario. Depth was
\* the right thing to trade for fidelity here - partial delivery and a replica
\* crashing mid-fan-out are failure modes an atomic write cannot express at
\* any depth.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Values = {v1, v2}
    WriteQuorum = 2
    MaxOps = 2
    MaxFailures = 1
    ClampQuorum = TRUE

INVARIANTS
    TypeOK
    NoResurrection
