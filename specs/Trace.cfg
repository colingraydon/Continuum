\* Trace conformance. Replays the execution recorded by TestTraceConformance
\* (tests/sim) against the model.
\*
\* Nodes and Values are strings here, not model values, because the recorder
\* emits the cluster's real identifiers and the generated TraceData.tla refers
\* to them by name. They must match the sim scenario's topology.
\*
\* MaxOps is the number of client operations the scenario performs. There is no
\* state-space concern here: the trace pins the behaviour to one path, so this
\* run explores a single line rather than a space.

SPECIFICATION TraceSpec

CONSTANTS
    Nodes = {"n1", "n2", "n3"}
    Values = {"v1"}
    WriteQuorum = 2
    MaxOps = 2
    MaxFailures = 1
    ClampQuorum = TRUE

\* TraceIncomplete is expected to be VIOLATED: the violation is the witness
\* that a path explained every recorded event. NoResurrection is checked at the
\* same time, so the model's safety property is evaluated against states the
\* real cluster actually reached. See the comment in Trace.tla.
INVARIANTS
    TypeOK
    NoResurrection
    TraceIncomplete
