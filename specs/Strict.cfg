\* The strict-quorum configuration: ClampQuorum is OFF, so a write is only
\* acknowledged once a full W replicas hold it.
\*
\* This is the configuration in which Durability is actually provable. The
\* code does NOT behave this way - it clamps, deliberately - so this config
\* exists to establish the baseline the clamp trades away. Running
\* Replication.cfg with Durability added produces the counterexample.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Values = {v1, v2}
    WriteQuorum = 2
    MaxOps = 3
    MaxFailures = 1
    ClampQuorum = FALSE

INVARIANTS
    TypeOK
    NoResurrection
    Durability
