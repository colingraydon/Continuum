coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    # Patch (diff) coverage is reported but does not block: error paths such as
    # fsync/rename/close failures in the storage engine are not exercisable
    # without a filesystem-injection seam, so a changed file's diff coverage can
    # dip below the project bar without the project itself regressing.
    patch:
      default:
        informational: true

ignore:
  - "cmd/"
